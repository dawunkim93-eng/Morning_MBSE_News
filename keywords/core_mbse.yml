# ─────────────────────────────────────────────────────────────────────────────
# 플러그인 : core_mbse
# 설명     : MBSE 핵심 키워드 플러그인.
#            모든 소스에 공통 적용되는 가장 기본적인 MBSE 관련 키워드를 정의한다.
# ─────────────────────────────────────────────────────────────────────────────
# 수정 이력
#   버전    날짜          내용
#   v1.0   2026-06-10   최초 작성 — MBSE 핵심 키워드 정의
# ─────────────────────────────────────────────────────────────────────────────

name: "MBSE 핵심"
priority: 1          # 낮을수록 먼저 로드됨 (핵심이므로 최우선)

# ── 소스별 검색 쿼리 ────────────────────────────────────────────────────────

# 네이버 뉴스 검색 키워드 (한/영 혼합)
naver:
  - "MBSE"
  - "Model-Based Systems Engineering"
  - "SysML"
  - "시스템 엔지니어링"
  - "MOSA"
  - "모델 기반 시스템 엔지니어링"

# Google News RSS 검색 쿼리
google_news:
  - "MBSE systems engineering"
  - "Model-Based Systems Engineering"
  - "SysML modeling"

# arXiv API 검색 쿼리 (all: 필드)
arxiv:
  - "Model-Based Systems Engineering"
  - "SysML MBSE"
  - "MBSE digital twin"

# Semantic Scholar 검색 쿼리 (단일 문자열)
semantic_scholar: "Model-Based Systems Engineering MBSE SysML"

# bash filter_keywords() 에 사용되는 grep 패턴 목록
filter:
  - "MBSE"
  - "SysML"
  - "model-based"
  - "systems engineering"
  - "시스템 엔지니어링"
  - "MOSA"

# ── 관련도 점수 가중치 ───────────────────────────────────────────────────────
# utils.py / agent3_summarize.sh 의 keyword_score() 에서 사용
scoring:
  core:
    - { term: "mbse",                              weight: 10 }
    - { term: "model-based systems engineering",   weight: 10 }
    - { term: "model based systems engineering",   weight: 10 }
    - { term: "모델 기반 시스템 엔지니어링",              weight: 10 }
    - { term: "sysml",                             weight: 8  }
    - { term: "mosa",                              weight: 7  }
    - { term: "모델기반",                             weight: 5  }
    - { term: "model-based",                       weight: 5  }
  related:
    - { term: "systems engineering",               weight: 4  }
    - { term: "시스템 엔지니어링",                       weight: 4  }
    - { term: "system modeling",                   weight: 3  }
    - { term: "digital twin",                      weight: 3  }
    - { term: "디지털 트윈",                           weight: 3  }
    - { term: "requirements management",           weight: 3  }
    - { term: "verification",                      weight: 2  }
    - { term: "validation",                        weight: 2  }
