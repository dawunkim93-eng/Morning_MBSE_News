name: "MBSE 도구"
priority: 2

# ── 소스별 검색 쿼리 ────────────────────────────────────────────────────────

naver:
  - "Cameo Systems Modeler"
  - "Capella MBSE"
  - "MagicDraw"

google_news:
  - "Capella MBSE tool"
  - "Cameo Systems Modeler MBSE"
  - "Rhapsody systems engineering"

arxiv:
  - "Cameo SysML tool"
  - "Capella MBSE modeling"

# Semantic Scholar 쿼리는 기존 core에서 커버되므로 생략 가능 (빈 값 허용)
semantic_scholar: ""

filter:
  - "Cameo"
  - "Capella"
  - "MagicDraw"
  - "Rhapsody"
  - "Enterprise Architect"
  - "Sparx"
  - "Papyrus"

scoring:
  core:
    - { term: "cameo",               weight: 6 }
    - { term: "capella",             weight: 6 }
    - { term: "magicDraw",           weight: 5 }
    - { term: "rhapsody",            weight: 5 }
  related:
    - { term: "enterprise architect", weight: 3 }
    - { term: "papyrus",              weight: 3 }
    - { term: "sparx",                weight: 3 }
    - { term: "modeling tool",        weight: 2 }
    - { term: "uml",                  weight: 2 }
